name: "publish"

# Stable release entrypoint. Reads the version from Cargo.toml (bump it before
# dispatching). CapSoftware/Cap keeps the CrabNebula desktop-release path.
# Any other repository, including this fork, publishes unsigned installers
# as assets on a GitHub release in that repository.

on:
  workflow_dispatch:
    inputs:
      interactionId:
        description: "Discord Interaction ID"
        required: false
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version number
        uses: SebRollen/toml-action@v1.0.2
        id: read_version
        with:
          file: apps/desktop/src-tauri/Cargo.toml
          field: "package.version"

  release:
    if: github.repository == 'CapSoftware/Cap'
    needs: version
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: stable
      sha: ${{ github.sha }}
      auto_publish: false
      interactionId: ${{ inputs.interactionId }}
    secrets: inherit

  github_release:
    if: github.repository != 'CapSoftware/Cap'
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/publish-github.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sha: ${{ github.sha }}
    secrets: inherit
